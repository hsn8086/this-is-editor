name: Build and Release
permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      include_debug:
        description: Build additional debug binaries
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    name: create-release
    needs: frontend
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 从 pyproject.toml 获取版本号（支持 Poetry 的 tool.poetry.version 或 PEP621 的 project.version）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Read version from pyproject.toml
        id: version
        run: |
          python - <<'PY'
          import tomllib, pathlib, os, sys
          p = pathlib.Path('pyproject.toml')
          if not p.exists():
              print('pyproject.toml not found', file=sys.stderr); sys.exit(1)
          data = tomllib.loads(p.read_text())
          version = data.get('tool',{}).get('poetry',{}).get('version') or data.get('project',{}).get('version')
          if not version:
              print('version not found in pyproject.toml', file=sys.stderr); sys.exit(1)
          print(f"version={version}", file=open(os.environ['GITHUB_OUTPUT'],'a'))
          PY

      # 发布到 GitHub Releases
      - id: create_release
        name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}.${{ github.run_number }}
          release_name: Release v${{ steps.version.outputs.version }}.${{ github.run_number }}
          draft: false
          prerelease: ${{ contains(github.ref, 'dev') }}

  frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install Node.js dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository1.0-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Generate licenses
        run: yarn license-gen

      - name: Check frontend types
        run: yarn type-check

      - name: Build frontend
        run: yarn build-only

      - name: Test frontend
        run: yarn test:run

      - name: Test backend
        run: uv run pytest tests/backend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    needs: [create-release, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        debug: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_debug && '["nodebug", "debug"]' || '["nodebug"]') }}
        # mode: [onefile, dir] # 定义构建模式矩阵
        mode: [onefile]
        # macos-latest 是 arm64，产物仅适用于 Apple Silicon
        os: [ubuntu-latest, windows-latest, macos-latest] # 定义操作系统矩阵

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install env
        shell: bash # 强制使用 Bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y libcairo2-dev libgirepository1.0-dev  # 安装 Linux 系统依赖
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # Nuitka 走 clang，ccache 命中时能把 C 编译从数百秒降到几十秒
            brew install ccache
          fi
          uv sync --locked

      - name: Restore Nuitka caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/.cache/ccache
            ~/AppData/Local/Nuitka/Nuitka/Cache
            ~/Library/Caches/Nuitka
            ~/Library/Caches/ccache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ matrix.debug }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ runner.os }}-

      # 构建项目
      - name: Build project
        shell: bash
        run: |
          args=(--mode "${{ matrix.mode }}")
          if [[ "${{ matrix.debug }}" == "debug" ]]; then
            args+=(--debug)
          fi
          uv run tools/builder.py "${args[@]}"

      # 冒烟测试：真正启动产物，确认能起服务再发布
      #
      # runner 没有图形环境，但历史上真正崩掉发布产物的问题（Nuitka 漏编模块、
      # PEP 695 导致导入期 NameError、web/ 没打进去）全部发生在开窗之前，
      # --self-check 正是跑到 webview.start() 之前为止，因此无需 display。
      - name: Smoke test built binary
        shell: bash
        timeout-minutes: 5
        run: |
          case "${{ matrix.os }}" in
            windows-latest) binary=".dist/main.exe" ;;
            # macOS 必须打成 app bundle 才能包含 PyObjC 框架，
            # 因此产物是目录而非单文件，可执行体在 Contents/MacOS 下。
            macos-latest)   binary=".dist/main.app/Contents/MacOS/main" ;;
            *)              binary=".dist/main.bin" ;;
          esac
          "$binary" --self-check --dev-user-data-dir "${RUNNER_TEMP}/tie-smoke"

      # 打包并解析出上传参数
      #
      # 以前这些值写在 upload 步骤的三层嵌套三元表达式里，加上 macOS 后已无法阅读，
      # 因此改为在这里算好再输出。macOS 的产物是 .app 目录，无论 mode 取什么都必须
      # 归档；用 ditto 而非 zip，它是 macOS 原生工具，能正确保留 bundle 里的符号链接
      # 与可执行权限。
      - name: Package artifact
        id: package
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            macos-latest)
              ditto -c -k --sequesterRsrc --keepParent .dist/main.app main.zip
              path="main.zip"; ext="zip"; type="application/zip"
              ;;
            windows-latest)
              if [[ "${{ matrix.mode }}" == "dir" ]]; then
                pwsh -Command "Compress-Archive -Path .dist/main.dist -DestinationPath main.zip"
                path="main.zip"; ext="zip"; type="application/zip"
              else
                path=".dist/main.exe"; ext="exe"
                type="application/vnd.microsoft.portable-executable"
              fi
              ;;
            *)
              if [[ "${{ matrix.mode }}" == "dir" ]]; then
                tar -czf main.tar.gz -C .dist/main.dist .
                path="main.tar.gz"; ext="tar.gz"; type="application/gzip"
              else
                path=".dist/main.bin"; ext="bin"; type="application/octet-stream"
              fi
              ;;
          esac

          suffix=""
          if [[ "${{ matrix.debug }}" == "debug" ]]; then
            suffix="-debug"
          fi

          {
            echo "asset_path=${path}"
            echo "asset_name=ThisIsEditor-${{ matrix.os }}${suffix}.${ext}"
            echo "asset_content_type=${type}"
          } >> "$GITHUB_OUTPUT"

          ls -lh "${path}"

      # 上传构建产物到 GitHub Release
      - name: Upload build artifacts
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.package.outputs.asset_path }}
          asset_name: ${{ steps.package.outputs.asset_name }}
          asset_content_type: ${{ steps.package.outputs.asset_content_type }}
