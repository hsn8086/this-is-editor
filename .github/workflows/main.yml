name: Build and Release
permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:
    inputs:
      include_debug:
        description: Build additional debug binaries
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 从 pyproject.toml 获取版本号（支持 Poetry 的 tool.poetry.version 或 PEP621 的 project.version）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Read version from pyproject.toml
        id: version
        run: |
          python - <<'PY'
          import tomllib, pathlib, os, sys
          p = pathlib.Path('pyproject.toml')
          if not p.exists():
              print('pyproject.toml not found', file=sys.stderr); sys.exit(1)
          data = tomllib.loads(p.read_text())
          version = data.get('tool',{}).get('poetry',{}).get('version') or data.get('project',{}).get('version')
          if not version:
              print('version not found in pyproject.toml', file=sys.stderr); sys.exit(1)
          print(f"version={version}", file=open(os.environ['GITHUB_OUTPUT'],'a'))
          PY

      # 发布到 GitHub Releases
      - id: create_release
        name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}.${{ github.run_number }}
          release_name: Release v${{ steps.version.outputs.version }}.${{ github.run_number }}
          draft: false
          prerelease: ${{ contains(github.ref, 'dev') }}

  frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install Node.js dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository1.0-dev

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Generate licenses
        run: yarn license-gen

      - name: Check frontend types
        run: yarn type-check

      - name: Test frontend
        run: yarn test:run

      - name: Test backend
        run: uv run pytest tests/backend

      - name: Build frontend
        run: yarn build-only

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build
    needs: [create-release, frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        debug: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_debug && '["nodebug", "debug"]' || '["nodebug"]') }}
        # mode: [onefile, dir] # 定义构建模式矩阵
        mode: [onefile]
        os: [ubuntu-latest, windows-latest] # 定义操作系统矩阵

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install env
        shell: bash # 强制使用 Bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y libcairo2-dev libgirepository1.0-dev  # 安装 Linux 系统依赖
          fi
          uv sync --locked

      - name: Restore Nuitka caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/.cache/ccache
            ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ matrix.debug }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            nuitka-${{ runner.os }}-

      # 构建项目
      - name: Build project
        shell: bash
        run: |
          args=(--mode "${{ matrix.mode }}")
          if [[ "${{ matrix.debug }}" == "debug" ]]; then
            args+=(--debug)
          fi
          uv run tools/builder.py "${args[@]}"

      # 压缩构建产物
      - name: Compress build artifacts
        shell: bash
        run: |
          if [[ "${{ matrix.mode }}" == "dir" ]]; then
            if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
              tar -czf main.tar.gz -C .dist/main.dist .
            elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
              pwsh -Command "Compress-Archive -Path .dist/main.dist -DestinationPath main.zip"
            fi
          fi

      # 上传构建产物到 GitHub Release
      - name: Upload build artifacts
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ matrix.os == 'windows-latest' && matrix.mode == 'onefile' && '.dist/main.exe' || matrix.os == 'windows-latest' && matrix.mode == 'dir' && 'main.zip' || matrix.os == 'ubuntu-latest' && matrix.mode == 'onefile' && '.dist/main.bin' || matrix.os == 'ubuntu-latest' && matrix.mode == 'dir' && 'main.tar.gz' }}
          asset_name: ThisIsEditor-${{ matrix.os }}${{ matrix.debug == 'debug' && '-debug' || '' }}.${{ matrix.os == 'windows-latest' && matrix.mode == 'onefile' && 'exe' || matrix.os == 'ubuntu-latest' && matrix.mode == 'onefile' && 'bin' || matrix.mode == 'dir' && matrix.os == 'windows-latest' && 'zip' || matrix.mode == 'dir' && matrix.os == 'ubuntu-latest' && 'tar.gz' }}
          asset_content_type: ${{ matrix.os == 'windows-latest' && matrix.mode == 'onefile' && 'application/vnd.microsoft.portable-executable' || matrix.os == 'windows-latest' && matrix.mode == 'dir' && 'application/zip' || matrix.os == 'ubuntu-latest' && matrix.mode == 'onefile' && 'application/octet-stream' || matrix.os == 'ubuntu-latest' && matrix.mode == 'dir' && 'application/gzip' }}
